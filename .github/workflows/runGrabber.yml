name: LinkGrabber

on:
  schedule:
    - cron: '0 */3 * * *'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runCode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # 更新到 v4

      - name: 配置 Git 凭据
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Grab Link
        run: |
          git config --global user.email "dp247@hll.localhost"
          git config --global user.name "dp247"
          chmod +x exec_grabber.sh && ./exec_grabber.sh
          git add -A
          git commit -m "./youtubeLink.txt is updated." || echo "没有需要提交的更改"
          git push --force-with-lease
