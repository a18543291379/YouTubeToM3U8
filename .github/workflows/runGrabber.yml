name: LinkGrabber

on:
  schedule:
    - cron: '0 */3 * * *'    # 每3小时运行一次（UTC时间）
  pull_request:
    branches: [ main ]       # PR到main分支时触发（一般不需要）
  workflow_dispatch:         # 支持手动触发

jobs:
  runCode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Grab Link
        run: |
          git config --global user.email "dp247@hll.localhost"
          git config --global user.name "dp247"
          chmod +x exec_grabber.sh && ./exec_grabber.sh   # 核心脚本
          git add -A
          git commit -m "./youtubeLink.txt is updated."
          git push
